<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/505/505730.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/505/505730.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏸Tiền Cầu 1.0🌿</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
        }
        .container { 
            max-width: 420px; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            margin: auto;
            position: relative;
            border: 2px solid #a5d6a7;
            overflow: hidden;
        }
        .container::before {
            content: "🌿🌸";
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            opacity: 0.7;
        }
        .container::after {
            content: "🍃";
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-size: 20px;
            opacity: 0.6;
        }
        h2 { 
            text-align: center; 
            color: #2e7d32; 
            margin-top: 0;
            font-size: 22px;
            letter-spacing: 1px;
            border-bottom: 2px dashed #a5d6a7;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 14px;
            color: #666;
            margin: 15px 0 5px 0;
            font-weight: bold;
            text-transform: uppercase;
        }
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        label { 
            font-weight: bold; 
            display: block; 
            color: #4f5b4d; 
            font-size: 15px;
            margin-bottom: 5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .icon {
            position: absolute;
            left: 12px;
            font-size: 18px;
        }
        input { 
            width: 100%; 
            padding: 10px 10px 10px 40px; 
            box-sizing: border-box; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.3s;
            background-color: #fafafa;
        }
        input:focus {
            border-color: #81c784;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 5px rgba(129, 199, 132, 0.5);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            margin-top: 20px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #f1f8e9; 
            border-radius: 12px; 
            border: 1px solid #c8e6c9;
            position: relative;
        }
        .result-title {
            font-weight: bold;
            color: #33691e;
            margin-bottom: 10px;
            text-align: center;
            font-size: 16px;
        }
        .result p { 
            margin: 8px 0; 
            font-size: 16px; 
            color: #333; 
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #c8e6c9;
            padding-bottom: 5px;
        }
        .result p:last-child {
            border-bottom: none;
        }
        .price { 
            font-weight: bold; 
            color: #c62828; 
            font-size: 17px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏸 TÍNH TIỀN CẦU LÔNG 🌿</h2>
    
    <div class="section-title">💰 Chi phí buổi tập</div>
    
    <div class="input-group">
        <label>Tiền sân:</label>
        <div class="input-wrapper">
            <span class="icon">🏟️</span>
            <input type="number" id="txtTienSan" value="0" onclick="this.select();">
        </div>
    </div>

    <div class="input-group">
        <label>Tiền cầu (hộp):</label>
        <div class="input-wrapper">
            <span class="icon">📦</span>
            <input type="number" id="txtTienCau" value="0" onclick="this.select();">
        </div>
    </div>

    <div class="input-group">
        <label>Tiền cầu lẻ:</label>
        <div class="input-wrapper">
            <span class="icon">🏸</span>
            <input type="number" id="txtTienCauLe" value="0" onclick="this.select();">
        </div>
    </div>

    <div class="section-title">🧑‍🤝‍🧑 Số lượng thành viên</div>

    <div class="input-group">
        <label>Số lượng Nam:</label>
        <div class="input-wrapper">
            <span class="icon">👦</span>
            <input type="number" id="txtSoLuongNam" value="0" onclick="this.select();">
        </div>
    </div>

    <div class="input-group">
        <label>Số lượng Nữ:</label>
        <div class="input-wrapper">
            <span class="icon">👧</span>
            <input type="number" id="txtSoLuongNu" value="0" onclick="this.select();">
        </div>
    </div>

    <div class="input-group">
        <label>Số lượng Nửa buổi (Về sớm/Tới trễ):</label>
        <div class="input-wrapper">
            <span class="icon">🕒</span>
            <input type="number" id="txtVeSomToiTre" value="0" onclick="this.select();">
        </div>
    </div>

    <button onclick="tinhTien()">🌸 TÍNH TIỀN NGAY 🌸</button>

    <div class="result">
        <div class="result-title">📋 BẢNG CHIA TIỀN CHI TIẾT</div>
        <p><span>👦 Tiền Nam (Làm tròn lên):</span> <span class="price" id="resNam">0K / người</span></p>
        <p><span>👧 Tiền Nữ (Làm tròn xuống):</span> <span class="price" id="resNu">0K / người</span></p>
        <p><span>🕒 Tiền Nửa buổi (Làm tròn xuống):</span> <span class="price" id="resNuaBuoi">0K / người</span></p>
    </div>
</div>

<script>
function tinhTien() {
    // 1. Lấy dữ liệu đầu vào
    let tienSan = parseFloat(document.getElementById('txtTienSan').value) || 0;
    let tienCau = parseFloat(document.getElementById('txtTienCau').value) || 0;
    let tienCauLe = parseFloat(document.getElementById('txtTienCauLe').value) || 0;
    
    // Tự động chuyển đổi nếu nhập số tắt (ví dụ nhập 500 tự hiểu là 500000)
    if (tienSan > 0 && tienSan < 10000) tienSan *= 1000;
    if (tienCau > 0 && tienCau < 10000) tienCau *= 1000;
    if (tienCauLe > 0 && tienCauLe < 10000) tienCauLe *= 1000;

    let soNam = parseFloat(document.getElementById('txtSoLuongNam').value) || 0;
    let soNu = parseFloat(document.getElementById('txtSoLuongNu').value) || 0;
    let soNuaBuoi = parseFloat(document.getElementById('txtVeSomToiTre').value) || 0;

    // 2. Tính các mẫu số theo nguyên tắc của nhóm
    let mauSoSan = soNam + soNu + (0.5 * soNuaBuoi);
    let mauSoCau = soNam + (0.67 * soNu) + (0.5 * soNuaBuoi);

    if (mauSoSan === 0 || mauSoCau === 0) {
        alert("Vui lòng nhập số lượng người chơi hợp lệ bạn nhé! 🥰");
        return;
    }

    // 3. Tính toán chi phí cơ sở cho Nam
    let tienSanNam = tienSan / mauSoSan;
    let tongTienCau = tienCau + tienCauLe;
    let tienCauNam = tongTienCau / mauSoCau;
    let tongNam = tienSanNam + tienCauNam;

    // 4. Tính toán chi phí cho Nữ và Nửa buổi
    let tongNu = tienSanNam + (tienCauNam * 0.67);
    let tongNuaBuoi = tongNam * 0.5;

    // 5. Áp dụng quy tắc làm tròn riêng biệt
    // Nam auto làm tròn lên (Math.ceil)
    let kNam = Math.ceil(tongNam / 1000);
    
    // Nữ auto làm tròn xuống (Math.floor)
    let kNu = Math.floor(tongNu / 1000);
    
    // Nửa buổi auto làm tròn xuống (Math.floor)
    let kNuaBuoi = Math.floor(tongNuaBuoi / 1000);

    // 6. Hiển thị kết quả lên màn hình dạng XXK
    document.getElementById('resNam').innerText = kNam + "K / người";
    document.getElementById('resNu').innerText = kNu + "K / người";
    document.getElementById('resNuaBuoi').innerText = kNuaBuoi + "K / người";
}
</script>

</body>
</html>
